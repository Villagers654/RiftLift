name: Build RiftLift compatibility payloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bridge:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - name: Fetch runtime dependency files
        shell: bash
        run: ../scripts/prepare-runtime-ci-deps.sh
      - name: Download Oculus PC SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'oculus-sdk.zip'
          Invoke-WebRequest 'https://securecdn.oculus.com/binaries/download/?id=4377593722298679' -OutFile $archive
          Expand-Archive $archive -DestinationPath Externals -Force
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg-binary-cache
            C:\vcpkg\installed
          key: runtime-vcpkg-v2-${{ runner.os }}
          restore-keys: |
            runtime-vcpkg-v1-${{ runner.os }}
            runtime-vcpkg-${{ runner.os }}-
      - name: Install native dependencies
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & C:\vcpkg\vcpkg.exe install --triplet x86-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe integrate install
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows ABI bridges
        shell: pwsh
        run: |
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenVR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftLauncher /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
      - name: Collect Windows bridge payload
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\riftlift-windows-bridge"
          Copy-Item Release\RiftLiftLauncher.exe $out
          Copy-Item Release\openvr_api64.dll $out
          Copy-Item Release\RiftLiftOpenVR64.dll $out
          Copy-Item Release\RiftLiftOpenXR32.dll $out
          Copy-Item Release\RiftLiftOpenXR64.dll $out
          Copy-Item windows-openvr\Input "$out\Input" -Recurse
          Copy-Item LICENSE $out
          Compress-Archive "$out\*" "$env:RUNNER_TEMP\riftlift-windows-bridge.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-windows-bridge
          path: ${{ runner.temp }}\riftlift-windows-bridge.zip

  native-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - name: Install native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopenxr-dev ninja-build
      - run: cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-native
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-native-runtime
          path: runtime/build-native/riftlift-runtime-host

  xrizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/xrizer
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake glslc libopenxr-dev libvulkan-dev libx11-xcb-dev ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            components/xrizer/target
          key: xrizer-release-v1-${{ runner.os }}-${{ hashFiles('components/xrizer/Cargo.lock') }}
      - run: cargo build --release
      - name: Collect xrizer payload
        run: |
          mkdir -p ../../out/xrizer
          cp target/release/libxrizer.so LICENSE ../../out/xrizer/
          tar -C ../../out -czf ../../riftlift-xrizer.tar.gz xrizer
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-xrizer
          path: riftlift-xrizer.tar.gz

  compatibility:
    needs: [windows-bridge, native-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: riftlift-windows-bridge
          path: downloaded/windows
      - uses: actions/download-artifact@v5
        with:
          name: riftlift-native-runtime
          path: downloaded/native
      - name: Install PE tooling
        run: sudo apt-get update && sudo apt-get install -y llvm mingw-w64 unzip
      - name: Download pinned Meta Platform implementation
        run: |
          curl --fail --location --output platform.pkg \
            "https://securecdn-atl3-3.oculus.com/binaries/download/?id=3766757683456363"
          echo "adbdc5f0285a2ac2ead6fdd34522de98de1bf6782017d9857ea4044b2d2fd009  platform.pkg" | sha256sum -c -
      - name: Build complete compatibility payload
        run: |
          unzip -q platform.pkg LibOVRPlatformImpl64_1.dll
          mkdir -p out
          unzip -q downloaded/windows/riftlift-windows-bridge.zip -d out
          install -Dm755 downloaded/native/riftlift-runtime-host out/bin/riftlift-runtime-host
          scripts/build-platform-shim.sh LibOVRPlatformImpl64_1.dll out/LibOVRPlatformImpl64_1.dll
          cp LICENSE out/RIFTLIFT-LICENSE
          find out -type f -exec touch -d '1980-01-01 00:00:00 UTC' {} +
          (cd out && TZ=UTC zip -X -9 -r ../riftlift-compat.zip .)
          sha256sum riftlift-compat.zip > riftlift-compat.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-compat
          path: |
            riftlift-compat.zip
            riftlift-compat.zip.sha256
