# A version tag (v1.2.3, or v1.2.3-rc1 for a pre-release) builds every download and runtime payload
# from source, runs the app's tests on the shipped configurations, and attaches everything (with
# SHA256SUMS, which the launcher's updater verifies against) to a DRAFT GitHub release named after the
# tag; the release text is reviewed before it is published. riftlift-runtime installs the compat,
# xrizer and DXVK payloads from the release named after its version, so the tag must match the CMake
# project version. Run manually on a branch, it builds and uploads the riftlift-release artifact only;
# run on a tag ("Use workflow from" > Tags), it rebuilds that release's downloads.
name: Build RiftLift compatibility payloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      payload: ${{ steps.version.outputs.payload }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Tag and project version agree
        run: |
          project=$(sed -n 's/^project(RiftLift VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          payload=
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            payload=${GITHUB_REF_NAME#v}
            if [[ "${payload%%-*}" != "$project" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the CMake project version $project"
              exit 1
            fi
          fi
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

  windows-app:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      test: true
      package: true

  # The linux-baseline build, its tests in the baseline container, and the tarball, .deb, .rpm,
  # AppImage and Flatpak.
  linux-app:
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      test: true
      package: true
      payload-version: ${{ needs.version.outputs.payload }}

  windows-bridge:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - name: Fetch runtime dependency files
        shell: bash
        run: ../scripts/prepare-runtime-ci-deps.sh
      - name: Download Oculus PC SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'oculus-sdk.zip'
          Invoke-WebRequest 'https://securecdn.oculus.com/binaries/download/?id=4377593722298679' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '3c8aeb66c822af731a8d1f1cb1cf97ab706100bf0bd003ef126f4bb9812906b3') {
            throw 'Oculus PC SDK checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath Externals -Force
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg-binary-cache
            C:\vcpkg\installed
          key: runtime-vcpkg-v2-${{ runner.os }}
          restore-keys: |
            runtime-vcpkg-v1-${{ runner.os }}
            runtime-vcpkg-${{ runner.os }}-
      - name: Install native dependencies
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & C:\vcpkg\vcpkg.exe install --triplet x86-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe integrate install
      - name: Test platform messages and native forwarding
        run: |
          cmake -S ../compat -B ../compat/build -A x64
          cmake --build ../compat/build --config Release
          ctest --test-dir ../compat/build -C Release --output-on-failure
      - name: Test launcher command-line quoting
        shell: pwsh
        run: |
          cmake -S windows-launcher/tests -B windows-launcher/tests/build -A x64
          cmake --build windows-launcher/tests/build --config Release
          ctest --test-dir windows-launcher/tests/build -C Release --output-on-failure
      - name: Build and test the Windows OpenXR layer
        shell: pwsh
        run: |
          cmake -S openxr-layer -B openxr-layer/build -A x64 -DOPENXR_INCLUDE_DIR=C:/vcpkg/installed/x64-windows-static/include
          cmake --build openxr-layer/build --config Release
          ctest --test-dir openxr-layer/build -C Release --output-on-failure
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows ABI bridges
        shell: pwsh
        run: |
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenVR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftLauncher /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          $launcher = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path 'Release\RiftLiftLauncher.exe')))
          if (-not $launcher.Contains('RiftLiftOpenVR64.dll')) { throw 'Launcher does not reference the packaged OpenVR bridge' }
          if ($launcher.Contains('\RiftLift64.dll')) { throw 'Launcher still references the obsolete OpenVR bridge name' }
      - name: Collect Windows bridge payload
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\riftlift-windows-bridge"
          Copy-Item Release\RiftLiftLauncher.exe $out
          Copy-Item openxr-layer\build\Release\RiftLiftOpenXRLayer.dll $out
          Copy-Item Release\openvr_api64.dll $out
          Copy-Item Release\RiftLiftOpenVR64.dll $out
          Copy-Item Release\RiftLiftOpenXR32.dll $out
          Copy-Item Release\RiftLiftOpenXR64.dll $out
          Copy-Item windows-openvr\Input "$out\Input" -Recurse
          Copy-Item LICENSE $out
          Compress-Archive "$out\*" "$env:RUNNER_TEMP\riftlift-windows-bridge.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-windows-bridge
          path: ${{ runner.temp }}\riftlift-windows-bridge.zip

  xrizer:
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: components/xrizer
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libopenxr-dev libvulkan-dev libx11-xcb-dev ninja-build
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/glslc
          key: glslc-ubuntu22-3cd72062f297df05e6a042f2616c42bc8956c326
      - name: Prepare the baseline shader compiler
        run: |
          test -x "$RUNNER_TEMP/glslc/bin/glslc" || ../../scripts/build-glslc.sh "$RUNNER_TEMP/glslc/bin/glslc"
          echo "$RUNNER_TEMP/glslc/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: xrizer-release-v3-ubuntu22-${{ hashFiles('components/xrizer/Cargo.lock') }}
      - run: cargo build --locked --release
      - name: Verify XRizer loads on the supported baseline
        run: python3 -c 'import ctypes, sys; lib = ctypes.CDLL(sys.argv[1]); lib.HmdSystemFactory; lib.VRClientCoreFactory' target/release/libxrizer.so
      - name: Collect xrizer payload
        run: |
          mkdir -p ../../out/xrizer
          cp target/release/libxrizer.so LICENSE ../../out/xrizer/
          find ../../out/xrizer -type f -exec touch -d '@0' {} +
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C ../../out -cf - xrizer \
            | gzip -n -9 > ../../riftlift-xrizer.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-xrizer
          path: riftlift-xrizer.tar.gz

  dxvk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install DXVK build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64 gcc-mingw-w64 glslang-tools meson ninja-build
      - name: Build pinned RiftLift DXVK compatibility DLLs
        shell: bash
        run: |
          # MinGW honors SOURCE_DATE_EPOCH for PE timestamps and build IDs.
          # Without it, identical source builds produce different payload hashes.
          export SOURCE_DATE_EPOCH=0
          git clone --filter=blob:none https://github.com/doitsujin/dxvk.git "$RUNNER_TEMP/dxvk-source"
          git -C "$RUNNER_TEMP/dxvk-source" checkout 3a4c6fa3cb1548d56a90a38dd8f526b6c13e63fd
          git -C "$RUNNER_TEMP/dxvk-source" submodule update --init --recursive --depth 1
          git -C "$RUNNER_TEMP/dxvk-source" apply "$GITHUB_WORKSPACE/components/dxvk/monotonic-fence-signals.patch"
          "$RUNNER_TEMP/dxvk-source/package-release.sh" 3.0.2-riftlift.1 "$RUNNER_TEMP" --no-package
          mkdir -p out/dxvk/x64 out/dxvk/x32
          for arch in x64 x32; do
            cp "$RUNNER_TEMP/dxvk-3.0.2-riftlift.1/$arch/d3d11.dll" "out/dxvk/$arch/"
            cp "$RUNNER_TEMP/dxvk-3.0.2-riftlift.1/$arch/dxgi.dll" "out/dxvk/$arch/"
          done
          cp "$RUNNER_TEMP/dxvk-source/LICENSE" out/dxvk/DXVK-LICENSE
          cp components/dxvk/README.md out/dxvk/RIFTLIFT-DXVK.md
          printf '%s\n' '3.0.2-riftlift.1' > out/dxvk/VERSION
          (cd out/dxvk && sha256sum x64/*.dll x32/*.dll > SHA256SUMS)
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C out -cf - dxvk \
            | gzip -n -9 > riftlift-dxvk.tar.gz
          sha256sum riftlift-dxvk.tar.gz > riftlift-dxvk.tar.gz.sha256
          tar -tzf riftlift-dxvk.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-dxvk
          path: |
            riftlift-dxvk.tar.gz
            riftlift-dxvk.tar.gz.sha256

  compatibility:
    needs: windows-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: riftlift-windows-bridge
          path: downloaded/windows
      - name: Install PE tooling
        run: sudo apt-get update && sudo apt-get install -y llvm mingw-w64 unzip
      - name: Download pinned Meta Platform implementation
        run: |
          curl --fail --location --output platform.pkg \
            "https://securecdn.oculus.com/binaries/download/?id=3766757683456363"
          echo "adbdc5f0285a2ac2ead6fdd34522de98de1bf6782017d9857ea4044b2d2fd009  platform.pkg" | sha256sum -c -
      - name: Build complete compatibility payload
        run: |
          unzip -q platform.pkg LibOVRPlatformImpl64_1.dll
          mkdir -p out
          unzip -q downloaded/windows/riftlift-windows-bridge.zip -d out
          scripts/build-platform-shim.sh LibOVRPlatformImpl64_1.dll out/LibOVRPlatformImpl64_1.dll
          cp LICENSE out/RIFTLIFT-LICENSE
          find out -type f -exec touch -d '1980-01-01 00:00:00 UTC' {} +
          (
            cd out
            export TZ=UTC
            find . -type f -printf '%P\0' | sort -z \
              | xargs -0 zip -X -9 ../riftlift-compat.zip
          )
          sha256sum riftlift-compat.zip > riftlift-compat.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-compat
          path: |
            riftlift-compat.zip
            riftlift-compat.zip.sha256

  release-bundle:
    needs: [compatibility, xrizer, dxvk, windows-app, linux-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The launcher's updater looks for RiftLift-windows64-setup.exe and
      # RiftLift-<version>-linux-x86_64.AppImage; riftlift-runtime downloads the
      # compat, xrizer and DXVK payloads from the release named after its version.
      - uses: actions/download-artifact@v5
        with:
          path: release
          pattern: riftlift-{windows,linux,compat,xrizer,dxvk}
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          rm -f -- *.sha256 SHA256SUMS
          version=$(sed -n 's/^project(RiftLift VERSION \([0-9.]*\).*/\1/p' ../CMakeLists.txt)
          for name in RiftLift-windows64-setup.exe RiftLift-windows64.zip "RiftLift-$version-linux-x86_64.AppImage" \
            "RiftLift-$version-linux-x86_64.tar.gz" "RiftLift-$version-linux-x86_64.deb" \
            "RiftLift-$version-linux-x86_64.rpm" "RiftLift-$version-linux-x86_64.flatpak" riftlift-compat.zip riftlift-xrizer.tar.gz riftlift-dxvk.tar.gz; do
            test -f "$name" || { echo "missing $name" >&2; exit 1; }
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-release
          path: release/

  # Tags only: a draft release with every download and SHA256SUMS ("<sha256>  <name>" per line, the
  # format update::expected_sum reads). Re-running on an existing release replaces its files.
  publish:
    needs: release-bundle
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Villagers654/RiftLift'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: riftlift-release
          path: assets
      - name: Verify checksums
        working-directory: assets
        run: sha256sum -c SHA256SUMS
      - name: Draft release
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
          else
            flags=(--draft --verify-tag --generate-notes --title "RiftLift ${version}")
            [[ "$version" == *-* ]] && flags+=(--prerelease)  # v1.2.3-rc1, v1.2.3-beta2
            gh release create "$TAG" assets/* "${flags[@]}" -R "$GITHUB_REPOSITORY"
          fi
