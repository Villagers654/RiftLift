name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      runtime: ${{ steps.filter.outputs.runtime }}
      xrizer: ${{ steps.filter.outputs.xrizer }}
      dxvk: ${{ steps.filter.outputs.dxvk }}
      compatibility: ${{ steps.filter.outputs.compatibility }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Select affected components
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          app=false
          runtime=false
          xrizer=false
          dxvk=false
          compatibility=false

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            app=true
            runtime=true
            xrizer=true
            dxvk=true
            compatibility=true
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == pull_request ]]; then
              base="$BASE_SHA"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
              app=true
              runtime=true
              xrizer=true
              dxvk=true
              compatibility=true
            else
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/*)
                    app=true
                    runtime=true
                    xrizer=true
                    dxvk=true
                    compatibility=true
                    ;;
                  compat/*|scripts/build-platform-shim.sh)
                    compatibility=true
                    ;;
                  scripts/build-glslc.sh)
                    xrizer=true
                    ;;
                  src/*|tests/*|scripts/*|assets/*|cmake/*|CMakeLists.txt|CMakePresets.json|install.sh)
                    app=true
                    ;;
                  runtime/*)
                    runtime=true
                    ;;
                  .gitmodules)
                    runtime=true
                    xrizer=true
                    ;;
                  components/xrizer|components/xrizer/*)
                    xrizer=true
                    ;;
                  components/dxvk|components/dxvk/*)
                    dxvk=true
                    ;;
                esac
              done < <(git diff --name-only "$base" "$GITHUB_SHA")
            fi
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "xrizer=$xrizer" >> "$GITHUB_OUTPUT"
          echo "dxvk=$dxvk" >> "$GITHUB_OUTPUT"
          echo "compatibility=$compatibility" >> "$GITHUB_OUTPUT"

  # The shipped configuration (linux-baseline in the release container), its tests and the
  # packaged layout's licenses and audit; see linux.yml.
  linux:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/linux.yml
    with:
      test: true
      package: false

  tooling:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y clang python3-pytest python3-yaml
      - name: Native code tests (Windows bridge input, D3D swapchains, platform exports)
        run: python3 -m pytest -q tests/tooling
      - name: Scripts and workflows parse
        run: |
          bash -n install.sh scripts/*.sh scripts/packaging/linux/*.sh
          python3 -m py_compile scripts/*.py scripts/packaging/*.py scripts/packaging/windows/*.py
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' .github/workflows/*.yml

  windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            .deps/llvm-mingw
            .deps/cmake
            .deps/ninja
          key: windows-tools-${{ hashFiles('scripts/bootstrap-windows.py') }}
      - uses: actions/cache@v4
        with:
          path: |
            .deps/fetch
            !.deps/fetch/*-build
            !.deps/fetch/*-subbuild
          key: windows-fetch-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt') }}
          restore-keys: windows-fetch-
      - run: python scripts/bootstrap-windows.py
      - run: .deps/cmake/bin/cmake --preset windows-release
      - run: .deps/cmake/bin/cmake --build build/windows-release
      - run: .deps/cmake/bin/ctest --test-dir build/windows-release --output-on-failure
      - run: build/windows-release/bin/riftlift-cli.exe --help

  xrizer:
    needs: changes
    if: needs.changes.outputs.xrizer == 'true'
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: components/xrizer
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libopenxr-dev libvulkan-dev libx11-xcb-dev ninja-build
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/glslc
          key: glslc-ubuntu22-3cd72062f297df05e6a042f2616c42bc8956c326
      - name: Prepare the baseline shader compiler
        run: |
          test -x "$RUNNER_TEMP/glslc/bin/glslc" || ../../scripts/build-glslc.sh "$RUNNER_TEMP/glslc/bin/glslc"
          echo "$RUNNER_TEMP/glslc/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            components/xrizer/target
          key: xrizer-ci-v3-ubuntu22-${{ hashFiles('components/xrizer/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --workspace --all-targets
      - run: cargo build --locked
      - name: Verify XRizer loads on the supported baseline
        run: python3 -c 'import ctypes, sys; lib = ctypes.CDLL(sys.argv[1]); lib.HmdSystemFactory; lib.VRClientCoreFactory' target/debug/libxrizer.so

  dxvk-patch:
    needs: changes
    if: needs.changes.outputs.dxvk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the pinned DXVK patch
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/doitsujin/dxvk.git "$RUNNER_TEMP/dxvk-source"
          git -C "$RUNNER_TEMP/dxvk-source" checkout 3a4c6fa3cb1548d56a90a38dd8f526b6c13e63fd
          git -C "$RUNNER_TEMP/dxvk-source" apply --check "$GITHUB_WORKSPACE/components/dxvk/monotonic-fence-signals.patch"

  platform-shim-tests:
    needs: changes
    if: needs.changes.outputs.compatibility == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Test platform messages and native forwarding
        run: |
          cmake -S compat -B compat/build -A x64
          cmake --build compat/build --config Release
          ctest --test-dir compat/build -C Release --output-on-failure

  platform-shim:
    needs: changes
    if: needs.changes.outputs.compatibility == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PE tooling
        run: sudo apt-get update && sudo apt-get install -y llvm mingw-w64 unzip
      - name: Build the platform compatibility shim
        shell: bash
        run: |
          curl --fail --location --output platform.pkg \
            "https://securecdn.oculus.com/binaries/download/?id=3766757683456363"
          echo "adbdc5f0285a2ac2ead6fdd34522de98de1bf6782017d9857ea4044b2d2fd009  platform.pkg" | sha256sum -c -
          unzip -q platform.pkg LibOVRPlatformImpl64_1.dll
          scripts/build-platform-shim.sh LibOVRPlatformImpl64_1.dll RiftLiftPlatformShim.dll

  runtime-windows-bridge:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: windows-2022
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - name: Fetch runtime dependency files
        shell: bash
        run: ../scripts/prepare-runtime-ci-deps.sh
      - name: Download Oculus PC SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'oculus-sdk.zip'
          Invoke-WebRequest 'https://securecdn.oculus.com/binaries/download/?id=4377593722298679' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '3c8aeb66c822af731a8d1f1cb1cf97ab706100bf0bd003ef126f4bb9812906b3') {
            throw 'Oculus PC SDK checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath Externals -Force
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg-binary-cache
            C:\vcpkg\installed
          key: runtime-vcpkg-v2-${{ runner.os }}
          restore-keys: |
            runtime-vcpkg-v1-${{ runner.os }}
            runtime-vcpkg-${{ runner.os }}-
      - name: Test OpenVR pose conversion
        shell: pwsh
        run: |
          cmake -S windows-openvr/tests -B windows-openvr/tests/build -A x64 -DOVR_INCLUDE_DIR="$pwd/Externals/LibOVR/Include"
          cmake --build windows-openvr/tests/build --config Release
          ctest --test-dir windows-openvr/tests/build -C Release --output-on-failure
      - name: Test launcher command-line quoting
        shell: pwsh
        run: |
          cmake -S windows-launcher/tests -B windows-launcher/tests/build -A x64
          cmake --build windows-launcher/tests/build --config Release
          ctest --test-dir windows-launcher/tests/build -C Release --output-on-failure
      - name: Build the simulated Touch controller test driver
        shell: pwsh
        run: |
          cmake -S tests/steamvr-touch-sim -B tests/steamvr-touch-sim/build -A x64
          cmake --build tests/steamvr-touch-sim/build --config Release
          if (-not (Test-Path tests/steamvr-touch-sim/build/riftlift_touchsim/bin/win64/driver_riftlift_touchsim.dll)) { throw 'Touch simulator driver missing' }
      - name: Install native dependencies
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & C:\vcpkg\vcpkg.exe install --triplet x86-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe integrate install
      - name: Build and test the Windows OpenXR layer
        shell: pwsh
        run: |
          cmake -S openxr-layer -B openxr-layer/build -A x64 -DOPENXR_INCLUDE_DIR=C:/vcpkg/installed/x64-windows-static/include
          cmake --build openxr-layer/build --config Release
          ctest --test-dir openxr-layer/build -C Release --output-on-failure
      - uses: microsoft/setup-msbuild@v2
      - name: Build RiftLift translation backends
        shell: pwsh
        run: |
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenVR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftLauncher /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          $launcher = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path 'Release\RiftLiftLauncher.exe')))
          if (-not $launcher.Contains('RiftLiftOpenVR64.dll')) { throw 'Launcher does not reference the packaged OpenVR bridge' }
          if ($launcher.Contains('\RiftLift64.dll')) { throw 'Launcher still references the obsolete OpenVR bridge name' }
