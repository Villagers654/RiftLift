name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install black pytest Pillow "cryptography>=42" "PySide6-Essentials>=6.7,<7"
      - run: python -m pip install "git+https://github.com/Villagers654/meta-pcvr-downloader.git@v0.1.1" . --no-deps
      - run: pytest -q
      - run: black --check src tests
      - run: python -m compileall -q src
      - run: bash -n install.sh scripts/*.sh
