name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      revive: ${{ steps.filter.outputs.revive }}
      xrizer: ${{ steps.filter.outputs.xrizer }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Select affected components
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          app=false
          revive=false
          xrizer=false

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            app=true
            revive=true
            xrizer=true
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == pull_request ]]; then
              base="$BASE_SHA"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
              app=true
              revive=true
              xrizer=true
            else
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/ci.yml)
                    app=true
                    revive=true
                    xrizer=true
                    ;;
                  src/*|tests/*|scripts/*|install.sh|pyproject.toml)
                    app=true
                    ;;
                  runtime/*|.gitmodules)
                    revive=true
                    ;;
                  components/xrizer/*)
                    xrizer=true
                    ;;
                esac
              done < <(git diff --name-only "$base" "$GITHUB_SHA")
            fi
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "revive=$revive" >> "$GITHUB_OUTPUT"
          echo "xrizer=$xrizer" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure EGL runtime is available
        run: dpkg-query -W libegl1 >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libegl1)
      - run: python -m pip install black pytest Pillow "cryptography>=42" "PySide6-Essentials>=6.7,<7"
      - run: python -m pip install "git+https://github.com/Villagers654/meta-pcvr-downloader.git@v0.1.1" . --no-deps
      - run: pytest -q
      - run: black --check src tests
      - run: python -m compileall -q src
      - run: bash -n install.sh scripts/*.sh

  xrizer:
    needs: changes
    if: needs.changes.outputs.xrizer == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: components/xrizer
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake glslc libopenxr-dev libvulkan-dev libx11-xcb-dev ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            components/xrizer/target
          key: xrizer-ci-v2-${{ runner.os }}-${{ hashFiles('components/xrizer/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --workspace --all-targets

  revive:
    needs: changes
    if: needs.changes.outputs.revive == 'true'
    runs-on: windows-2022
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - name: Fetch required Revive dependency files
        shell: bash
        run: ../scripts/prepare-revive-ci-deps.sh
      - name: Download Oculus PC SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'oculus-sdk.zip'
          Invoke-WebRequest 'https://securecdn.oculus.com/binaries/download/?id=4377593722298679' -OutFile $archive
          Expand-Archive $archive -DestinationPath Externals -Force
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg-binary-cache
            C:\vcpkg\installed
          key: revive-vcpkg-v2-${{ runner.os }}
          restore-keys: |
            revive-vcpkg-v1-${{ runner.os }}
            revive-vcpkg-${{ runner.os }}-
      - name: Install native dependencies
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & C:\vcpkg\vcpkg.exe install --triplet x86-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe integrate install
      - uses: microsoft/setup-msbuild@v2
      - name: Build RiftLift translation backends
        shell: pwsh
        run: |
          msbuild Revive.sln /m /t:ReviveXR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild Revive.sln /m /t:ReviveXR /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143
          msbuild Revive.sln /m /t:Revive /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild Revive.sln /m /t:ReviveInjector /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
