name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      runtime: ${{ steps.filter.outputs.runtime }}
      xrizer: ${{ steps.filter.outputs.xrizer }}
      dxvk: ${{ steps.filter.outputs.dxvk }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Select affected components
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          app=false
          runtime=false
          xrizer=false
          dxvk=false

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            app=true
            runtime=true
            xrizer=true
            dxvk=true
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == pull_request ]]; then
              base="$BASE_SHA"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
              app=true
              runtime=true
              xrizer=true
              dxvk=true
            else
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/ci.yml)
                    app=true
                    runtime=true
                    xrizer=true
                    dxvk=true
                    ;;
                  src/*|tests/*|scripts/*|install.sh|pyproject.toml)
                    app=true
                    ;;
                  runtime/*)
                    runtime=true
                    ;;
                  .gitmodules)
                    runtime=true
                    xrizer=true
                    ;;
                  components/xrizer|components/xrizer/*)
                    xrizer=true
                    ;;
                  components/dxvk|components/dxvk/*)
                    dxvk=true
                    ;;
                esac
              done < <(git diff --name-only "$base" "$GITHUB_SHA")
            fi
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "xrizer=$xrizer" >> "$GITHUB_OUTPUT"
          echo "dxvk=$dxvk" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure EGL runtime is available
        run: dpkg-query -W libegl1 >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libegl1)
      - run: python -m pip install black pytest Pillow "cryptography>=42" "PySide6-Essentials>=6.7,<7"
      - run: python -m pip install "git+https://github.com/Villagers654/meta-pcvr-downloader.git@v0.1.1" . --no-deps
      - run: pytest -q
      - run: black --check src tests
      - run: python -m compileall -q src
      - run: bash -n install.sh scripts/*.sh
      - name: Verify release installer generation
        shell: bash
        run: |
          touch riftlift-0.0.0a0-py3-none-any.whl
          scripts/generate-release-installer.sh \
            v0.0.0-alpha.0 \
            riftlift-0.0.0a0-py3-none-any.whl \
            /tmp/riftlift-installer.sh
          bash -n /tmp/riftlift-installer.sh
          grep -F "wheel_sha256='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'" /tmp/riftlift-installer.sh
          touch riftlift-0.0.0-py3-none-any.whl
          scripts/generate-release-installer.sh \
            v0.0.0 \
            riftlift-0.0.0-py3-none-any.whl \
            /tmp/riftlift-stable-installer.sh
          bash -n /tmp/riftlift-stable-installer.sh
          touch riftlift-0.0.0.1-py3-none-any.whl
          scripts/generate-release-installer.sh \
            v0.0.0.1 \
            riftlift-0.0.0.1-py3-none-any.whl \
            /tmp/riftlift-patch-installer.sh
          bash -n /tmp/riftlift-patch-installer.sh

  xrizer:
    needs: changes
    if: needs.changes.outputs.xrizer == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: components/xrizer
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake glslc libopenxr-dev libvulkan-dev libx11-xcb-dev ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            components/xrizer/target
          key: xrizer-ci-v2-${{ runner.os }}-${{ hashFiles('components/xrizer/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --workspace --all-targets

  dxvk-patch:
    needs: changes
    if: needs.changes.outputs.dxvk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the pinned DXVK patch
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/doitsujin/dxvk.git "$RUNNER_TEMP/dxvk-source"
          git -C "$RUNNER_TEMP/dxvk-source" checkout 3a4c6fa3cb1548d56a90a38dd8f526b6c13e63fd
          git -C "$RUNNER_TEMP/dxvk-source" apply --check "$GITHUB_WORKSPACE/components/dxvk/monotonic-fence-signals.patch"

  runtime-windows-bridge:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: windows-2022
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - name: Fetch runtime dependency files
        shell: bash
        run: ../scripts/prepare-runtime-ci-deps.sh
      - name: Download Oculus PC SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'oculus-sdk.zip'
          Invoke-WebRequest 'https://securecdn.oculus.com/binaries/download/?id=4377593722298679' -OutFile $archive
          Expand-Archive $archive -DestinationPath Externals -Force
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\vcpkg-binary-cache
            C:\vcpkg\installed
          key: runtime-vcpkg-v2-${{ runner.os }}
          restore-keys: |
            runtime-vcpkg-v1-${{ runner.os }}
            runtime-vcpkg-${{ runner.os }}-
      - name: Install native dependencies
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & C:\vcpkg\vcpkg.exe install --triplet x86-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static detours openxr-loader glfw3
          & C:\vcpkg\vcpkg.exe integrate install
      - uses: microsoft/setup-msbuild@v2
      - name: Build RiftLift translation backends
        shell: pwsh
        run: |
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenXR /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftOpenVR /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          msbuild RiftLiftRuntime.sln /m /t:RiftLiftLauncher /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          $launcher = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path 'Release\RiftLiftLauncher.exe')))
          if (-not $launcher.Contains('RiftLiftOpenVR64.dll')) { throw 'Launcher does not reference the packaged OpenVR bridge' }
          if ($launcher.Contains('\RiftLift64.dll')) { throw 'Launcher still references the obsolete OpenVR bridge name' }
