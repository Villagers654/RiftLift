[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftlift"
version = "0.10.1"
description = "Plug-and-play Meta Rift games for working Linux OpenXR runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Villagers654"}]
keywords = ["linux", "meta", "monado", "oculus", "openxr", "rift", "vr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "meta-pcvr-downloader @ git+https://github.com/Villagers654/meta-pcvr-downloader.git@v0.1.1",
  "pefile>=2024.8.26",
  "Pillow>=10",
  "PySide6-Essentials>=6.7,<7",
]

[project.urls]
Homepage = "https://github.com/Villagers654/RiftLift"
Issues = "https://github.com/Villagers654/RiftLift/issues"
Runtime = "https://github.com/Villagers654/RiftLift/tree/main/runtime"
xrizer = "https://github.com/Villagers654/xrizer"

[project.scripts]
riftlift = "riftlift.cli:main"
riftlift-gui = "riftlift.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
  "B",    # likely bugs and unsafe constructs
  "C4",   # unnecessary collection transformations
  "E4",   # import errors
  "E7",   # statement errors
  "E9",   # runtime and syntax errors
  "F",    # Pyflakes
  "I",    # deterministic imports
  "PIE",  # avoidable Python constructs
  "RUF",  # Ruff-specific correctness checks
  "SIM",  # needless control-flow complexity
  "UP",   # modern syntax supported by Python 3.10+
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true
