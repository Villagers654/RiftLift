[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftlift"
version = "0.9.0a6"
description = "Plug-and-play Meta Rift games for working Linux OpenXR runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Villagers654"}]
keywords = ["linux", "meta", "monado", "oculus", "openxr", "rift", "vr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "meta-pcvr-downloader @ git+https://github.com/Villagers654/meta-pcvr-downloader.git@v0.1.1",
  "Pillow>=10",
  "PySide6-Essentials>=6.7,<7",
]

[project.urls]
Homepage = "https://github.com/Villagers654/RiftLift"
Issues = "https://github.com/Villagers654/RiftLift/issues"
Runtime = "https://github.com/Villagers654/RiftLift/tree/main/runtime"
xrizer = "https://github.com/Villagers654/RiftLift/tree/main/components/xrizer"

[project.scripts]
riftlift = "riftlift.cli:main"
riftlift-gui = "riftlift.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]
