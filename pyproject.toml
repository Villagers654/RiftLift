[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftlift"
version = "0.1.0"
description = "Run owned Meta Rift games on standards-based Linux OpenXR runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Villagers654"}]
keywords = ["linux", "meta", "monado", "oculus", "openxr", "rift", "vr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = ["meta-pcvr-downloader @ git+https://github.com/Villagers654/meta-pcvr-downloader.git@v0.1.1"]

[project.urls]
Homepage = "https://github.com/Villagers654/RiftLift"
Issues = "https://github.com/Villagers654/RiftLift/issues"
Revive = "https://github.com/Villagers654/Revive"
xrizer = "https://github.com/Villagers654/xrizer"

[project.scripts]
riftlift = "riftlift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
